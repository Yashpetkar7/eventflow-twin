name: eval-gate
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"   # nightly full run (02:00 UTC)
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements-min.txt && make synth
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then make eval; else make eval-fast; fi
      - name: Gate
        run: python -m eval.gate --thresholds eval/thresholds.yaml --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/
