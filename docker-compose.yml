# EventFlow Twin on one machine without Python or Node set up (docs/DEPLOY.md, decision #134).
#   docker compose up --build                                                   booth mode: API + web, offline after the build
#   docker compose -f docker-compose.yml -f docker-compose.saas.yml up --build  product mode: + Postgres, sign-in and roles
# Nothing is sent anywhere unless OTEL_EXPORTER_OTLP_ENDPOINT is set (tracing to Langfuse or any OTLP collector).
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DEMO_MODE: offline
      EVENTFLOW_DATA_DIR: /app/data
    volumes: ["eft-data:/app/data/processed"]
  web:
    build:
      context: apps/web
      args: {NEXT_PUBLIC_API_URL: "http://localhost:8000"}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  eft-data: {}
