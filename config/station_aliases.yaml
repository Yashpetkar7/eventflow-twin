# this file covers renamed stations and anything else it cannot match. The data runs 2017–2026, so OLD names appear.
# `python tasks.py ingest` lists every name it could not map, with its row count — add those here and re-run.
# Renames below are the widely reported ones; VERIFY each against the unmatched list before relying on it.
