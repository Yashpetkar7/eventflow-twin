# Incident what-ifs for the duty view (decision #128). Assumptions for a what-if, not RTA figures and not forecasts of
# real incidents. Kept out of corridor.yaml on purpose: this file is not part of the config hash, so the plan cache,
# the web snapshot and the recorded runs stay valid; an incident enters a run id only when a request uses one.
train_fault:              # a fault on one line: part of the scheduled service is lost for a while
  line: Red
  capacity_factor: 0.5    # share of the scheduled trains that still run
  hours: 2                # from the incident hour
crowd_surge:
  attendance_factor: 1.3  # the event draws 30 % more visitors than planned
rain:
  weather: rain           # the existing weather what-if (config/corridor.yaml event_model.weather_metro_share)
heat:
  weather: hot
