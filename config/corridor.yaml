# Assumptions + the FEATURED corridor. The full network (all metro stations, lines, neighbours) is generated
# into config/network.yaml by scripts/build_network.py; the stations below only fix the ids of the featured
# corridor (matched by gtfs_stop_ids). config.corridor() serves the whole network under `stations`.
# Station names, stop ids and coordinates verified against the official RTA GTFS feed
# (service Sep–Dec 2021, stops "<Name> Metro Station 1/2"); coordinates = mean of the two platforms.
# Arabic names (name_ar) = official GTFS translations.txt (prefix "محطة المترو_" and platform digit removed).
# Re-check names against the Dubai Pulse metro stations dataset once ridership is ingested.
corridor_name: Sheikh Zayed Road / Trade Centre
timezone: Asia/Dubai
bins_per_hour: 4               # simulator + event overlay resolution (15-min bins); UI aggregates to hours
stations:
  - {id: MAX, name_en: "Max",                      name_ar: "ماكس", line: Red, lat: 25.232984, lon: 55.291774, gtfs_stop_ids: [13801, 13802]}
  - {id: WTC, name_en: "World Trade Centre",       name_ar: "المركز التجاري العالمي", line: Red, lat: 25.225489, lon: 55.285489, gtfs_stop_ids: [13901, 13902]}
  - {id: EMT, name_en: "Emirates Towers",          name_ar: "أبراج الإمارات", line: Red, lat: 25.217178, lon: 55.279792, gtfs_stop_ids: [14001, 14002]}
  - {id: FIC, name_en: "Financial Centre",         name_ar: "المركز المالي", line: Red, lat: 25.210956, lon: 55.275493, gtfs_stop_ids: [14101, 14102]}
  - {id: BKD, name_en: "Burj Khalifa/Dubai Mall",  name_ar: "برج خليفة / دبي مول", line: Red, lat: 25.201471, lon: 55.269574, gtfs_stop_ids: [14201, 14202]}
  - {id: BBY, name_en: "Business Bay",             name_ar: "الخليج التجاري", line: Red, lat: 25.191356, lon: 55.260437, gtfs_stop_ids: [14301, 14302]}
# Walkable neighbours are generated (adjacent on a line and within interventions.bounds.max_redirect_walk_min).
capacity:
  # Trains per hour come from the official RTA GTFS timetable (config/capacity_gtfs.yaml, generated by
  # scripts/build_network.py), per station, line and direction. `source: assumption` falls back to headway_min.
  source: gtfs
  # Post-2022 weekday (0=Mon … 6=Sun) → 2021 GTFS service pattern (2021 had a Fri–Sat weekend) [ASSUMPTION]
  gtfs_daytype_for_weekday: {0: mon+tue+wed+sun, 1: mon+tue+wed+sun, 2: mon+tue+wed+sun, 3: mon+tue+wed+sun, 4: thu, 5: sat, 6: fri}
  direction_split: 0.5         # share of boarders heading in direction 0 (vs 1) [ASSUMPTION – derive from ridership OD]
  train_capacity: 700          # passengers per train [ASSUMPTION – replace from capacity dataset D3]
  boardable_share: 0.35        # share of a train's capacity available to boarders at one station [ASSUMPTION – derive through-load from ridership OD]
  headway_min: {peak: 4, offpeak: 6, night: 8}   # fallback only (source: assumption)
  min_headway_min: 2.5         # lower bound for extra_trains [ASSUMPTION]
  overcap_threshold: 0.85
event_model:                   # parametric overlay (docs/05 §5.2) – all ASSUMPTIONS, calibrate in Phase 2
  metro_share: 0.45
  return_factor: 1.0
  arrival_offset_min: -60
  arrival_sigma_min: 45
  exit_offset_min: 20
  exit_sigma_min: 30
  walk_tau_min: 8
  walk_cutoff_min: 30           # stations further than this walk get no event trips [ASSUMPTION]
  attendance_band: [0.75, 1.25]  # p10/p90 multipliers on the event surge (attendance uncertainty) [ASSUMPTION]
  # Timing profiles per event type (override the defaults above). All ASSUMPTIONS until calibrated on ridership.
  # exhibition: visitors arrive across the morning and leave across the afternoon, with a bump at closing time.
  profiles:
    default: {}
    exhibition: {arrival_offset_min: 75, arrival_sigma_min: 90, exit_offset_min: -45, exit_sigma_min: 75}
interventions:
  bus_capacity: 80
  bus_trips_per_hour: 3
  robotaxi_occupancy: 1.6
  robotaxi_trips_per_hour: 2
  cost_proxy: {extra_trains_per_train_hour: 3.0, shuttle_bus_hour: 1.0, robotaxi_vehicle_hour: 0.4, staggered_exit: 2.0, wayfinding_redirect: 0.5}
  ranking_lambda: 20
  # Hard parameter bounds; requests outside these are rejected (HTTP 422), never silently clipped.
  bounds:
    max_buses: 30
    max_robotaxi_vehicles: 60
    max_redirect_share: 0.5
    max_redirect_walk_min: 25     # wayfinding only between adjacent stations within this walk [ASSUMPTION]
    stagger_minutes: [15, 90]
