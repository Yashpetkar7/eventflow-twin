# Agent engine settings (docs/15_AGENT_ARCHITECTURE.md). Not part of config_hash: changing these never changes a
# forecast or simulation run id, only how the agents work and what the critic reports.
engine: graph                  # graph (LangGraph) · seq (same agents, plain loop) · classic (the original planner)

budget:                        # the supervisor stops replanning and hands over when any of these is reached
  steps_max: 60                # agent steps in one mission
  simulations_max: 80          # simulator runs, stress tests included
  model_calls_max: 12          # language-model calls
  wall_ms_max: 45000           # wall-clock time

critic:                        # C4–C7 are reported on every option; they do not change the ranking in this release
  max_wait_min: 10             # C4: longest platform or gate wait an option may leave (minutes) [ASSUMPTION]
  road_pressure_rise_max: 0.0  # C5: share by which an option may raise the road-pressure peak over the baseline
  stress_hold_min: 0.5         # C7: an option is fragile when it keeps every station under the threshold in fewer
                               #     than this share of the stress cases

calm:                          # the "calm" checkpoint (decision #153): nothing over the line, so the team tests harder and asks
  line_min: 0.70               # the comfort-line slider's lowest step: no stricter line than this is suggested
stress:                        # C7: each kept option re-simulated under changed assumptions
  attendance: [1.10, 1.25]     # × the scenario's attendance
  metro_share: [0.55, 0.65]    # share of event trips by metro
  weather: [hot, rain]
  demand_level: [real_totals]  # corridor stations scaled to their measured real weekday totals (config/calibration.yaml)

intake:                        # instruction-like text in goal or notes is logged as an injection finding, never followed.
  # Written after reading the red-team cases (eval/gold/redteam.jsonl), so their recall is in-sample; the first line of
  # defence is that text never changes a simulation (constraints are typed), detection only makes attempts visible.
  injection_patterns:
    - '\bignore\b'
    - '\bdisregard\b'
    - '\boverride'
    - 'system prompt'
    - '\bsystem:'
    - 'you are now'
    - 'admin(istrator)? mode|developer mode|\bas administrator\b'
    - 'new (goal|task|instructions?)'
    - '\binstead\b.*\b(translate|write|poem)'
    - 'stop planning'
    - '\btranslate\b'
    - '\bi am (the|an?) (director|administrator|admin|manager|operator|ceo)'
    - '\bmy authority\b'
    - 'pre-?authori[sz]e'
    - '\b(call|run|use|load|install)\b.{0,40}\b(tool|plugin|pip|menu\.json|delete_\w+)'
    - '\bpip install\b|\binstall the plugin\b'
    - 'https?://'
    - '<\s*/?\s*(script|goal|untrusted)'
    - '__import__|os\.system|drop table|\{\{|\$\{|<%'
    - '\bapi key\b'
    - '\bremember (this |for )|save (this )?to memory|earlier in this conversation|\bcontinue from there\b'
    - '\[message from|\"role\"\s*:|\boverride\"'
    - 'skip the simulator|disable the number check|without (verification|reading)'
    - 'replan \d+ times|retry until'
    - '\bapprove\b.{0,30}\b(yourself|automatically|everything|all|now)'
    - 'approved (by|it)|\bverified by\b|mark all options as approved'
    - 'no human review|guaranteed safe|lives are at risk'
    - 'say (rta|the rta)|rta approved'
    - 'capacity is unlimited|unlimited capacity|report (peak )?load as|use 0 everywhere|multiplied by ten|cost proxy -'
    - 'treat \d+ ?% as|threshold (to|is|=) \d+|ignore the threshold|\d{3,} ?% '
    - 'maximi[sz]e crowding|removing trains|remove (all )?trains'
    - 'تجاهل'
    - 'التعليمات'
    - 'الهدف الجديد'
    - 'وضع المطو'
    - 'مفتاح الواجهة'
    - 'مدير النظام|صلاحيات'
    - 'تجاوز التحقق'
    - 'احفظ في الذاكرة|من الآن فصاعد'
    - 'رسالة من وكيل'
    - 'اعتمدت|معتمد'
    - 'مضمونة|موافقة بشرية|لا وقت للمراجعة'
    - 'غير محدودة|بتكلفة صفر|أعلى حمولة هي'
    - 'لا تقترح أي إجراء'
    - 'اعتبر الحد|الحد هو \d+'
    - 'قل إن'
    - 'ثم توقف|عاجل'
